<style>
:root{--bg:#f4efe6;--fg:#2b2620;--acc:#8a6b3f;--on:#fff;--f:system-ui,-apple-system,"Segoe UI",sans-serif;--r:8px;--gap:12px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f);transition:background .3s,color .3s}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:10px 17px;background:linear-gradient(135deg,var(--acc),color-mix(in srgb,var(--acc) 76%,var(--fg)));color:var(--on);font-weight:650;box-shadow:0 3px 10px #0002;transition:transform .18s,filter .18s}
button:hover{filter:brightness(1.08);transform:translateY(-1px);box-shadow:0 5px 14px #0003}button:active{transform:scale(.97)}
button.g{background:color-mix(in srgb,var(--fg) 7%,transparent);color:inherit;border:1px solid color-mix(in srgb,var(--fg) 22%,transparent);box-shadow:none}
button.d{background:color-mix(in srgb,#d33 8%,transparent);color:#d33;border:1px solid #d3355;box-shadow:none}
.ph.dragging,.rb.dragging{opacity:.35;outline:2px dashed var(--acc);outline-offset:3px}.ph.drop-target,.rb.drop-target{outline:3px solid var(--acc);outline-offset:2px}
button.g{background:transparent;color:inherit;border:1px solid #8886}button.d{background:transparent;color:#d33;border:1px solid #d3355}
button:disabled{opacity:.35;cursor:default}
nav{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:8px;padding:10px 16px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px)}
nav b{flex:1;text-align:center;font-size:.9rem}
main{max-width:1100px;margin:auto;padding:8px 16px 130px}
h1{font-size:clamp(2rem,6vw,3.4rem);margin:14px 0 10px;letter-spacing:-.02em}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px;overflow-x:auto}
.chip.on{background:var(--fg);color:var(--bg)}.chip{white-space:nowrap}
.grid{display:grid;gap:var(--gap);grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.ph{position:relative;aspect-ratio:9/16;border-radius:var(--r);overflow:hidden;background:#8882;cursor:zoom-in}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .a{position:absolute;display:flex;gap:4px;padding:6px}.ph .a button{padding:5px 9px;background:#000b;color:#fff}
.ph .t{top:0;left:0}.ph .bt{bottom:0;right:0}
.cv{aspect-ratio:9/16;border-radius:var(--r);overflow:hidden;position:relative;cursor:pointer;display:flex;align-items:flex-end;color:#fff;background:#888}
.cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.cv span{position:relative;width:100%;padding:30px 10px 10px;background:linear-gradient(transparent,#000a);font-weight:600}
.cv .a{position:absolute;top:0;left:0;display:flex;gap:4px;padding:6px;z-index:2}.cv .a button{padding:5px 9px;background:#000b}
#lb{position:fixed;inset:0;background:#000e;z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
#lb.on{display:flex}#lb img{max-height:80vh;max-width:94vw;aspect-ratio:9/16;object-fit:contain;border-radius:8px}
#lb button{background:#fff;color:#000}

}

.pr .c div+div{border-left:1px solid color-mix(in srgb,var(--fg) 18%,transparent)}
.pr small{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;opacity:.7}
.pr strong{display:block;font-size:1.1rem;margin-top:2px;word-break:break-word}

@media (max-width:600px){.pr strong{font-size:1rem}}

.rb{--b:var(--acc);--c:var(--on);--a:var(--on);position:relative;display:flex;align-items:center;gap:16px;min-height:96px;padding:20px 22px;border-radius:calc(var(--r) + 6px);background:var(--b);color:var(--c);border:1px solid color-mix(in srgb,var(--c) 22%,transparent);box-shadow:0 1px 0 color-mix(in srgb,var(--c) 10%,transparent) inset,0 12px 26px -16px #0007;overflow:hidden;cursor:pointer;user-select:none;-webkit-user-select:none;opacity:0;animation:rbIn .6s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i,0)*70ms);transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s,opacity .3s}
.rb::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--a);transition:width .45s cubic-bezier(.2,.8,.2,1),opacity .45s}
.rb::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;background:linear-gradient(100deg,transparent,color-mix(in srgb,var(--c) 18%,transparent),transparent);transform:skewX(-18deg);transition:left .8s ease;pointer-events:none}
.rb>*{position:relative;z-index:1}
.rb .n{font-size:.8rem;letter-spacing:.18em;opacity:.55;font-variant-numeric:tabular-nums;min-width:2ch}
.rb .t{flex:1;display:flex;flex-direction:column;gap:3px;text-align:left;min-width:0}
.rb .t>span{font-size:1.25rem;font-weight:600;letter-spacing:-.01em;line-height:1.15;overflow-wrap:anywhere}
.rb .t small{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;opacity:.6}
.rb .ar{width:40px;height:40px;flex:none;display:grid;place-items:center;border-radius:50%;border:1px solid color-mix(in srgb,var(--c) 30%,transparent);font-size:1.15rem;transition:transform .4s cubic-bezier(.2,.8,.2,1),background .3s,color .3s}
@media (hover:hover){
 .rb:hover{transform:translateY(-5px);box-shadow:0 1px 0 color-mix(in srgb,var(--c) 10%,transparent) inset,0 22px 34px -18px #000a}
 .rb:hover::before{width:100%;opacity:.1}
 .rb:hover::after{left:120%}
 .rb:hover .ar{transform:translateX(5px);background:var(--c);color:var(--b)}
}
.rb:active{transform:scale(.97);transition-duration:.12s}
.rb.go{transform:scale(1.03);box-shadow:0 26px 40px -18px #000b;z-index:2}
.rb.go::before{width:100%;opacity:.16}
.rb.go .ar{transform:translateX(10px) scale(1.1);background:var(--c);color:var(--b)}
.bl.leaving .rb:not(.go){opacity:.15!important;transform:scale(.95);transition-duration:.25s}
.rb .a{position:absolute;top:50%;right:10px;transform:translateY(-50%);display:flex;gap:4px;z-index:3}.rb .a button{padding:5px 9px;min-width:38px;background:#000b;color:#fff}
@keyframes rbIn{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}

function loginView(A){
 A.innerHTML=`<div class="logo"></div><div style="max-width:340px;margin:18px auto"><h3 style="text-align:center">Ingresar</h3><input type="text" id="em" placeholder="Usuario" autocomplete="username" autocapitalize="none" autocorrect="off"><input type="password" id="pw" placeholder="PIN o contraseña" autocomplete="current-password"><p id="er" style="color:#d33;min-height:1.2em;margin:0 0 8px"></p><button id="o" style="width:100%">Entrar</button></div>`;
 const go=async()=>{const b=$("#o");b.disabled=true;const{error}=await sb.auth.signInWithPassword(cred($("#em").value,$("#pw").value));if(error){$("#er").textContent="Datos incorrectos";b.disabled=false}};
 $("#o").onclick=go;[$("#em"),$("#pw")].forEach(i=>i.onkeydown=e=>{if(e.key==="Enter")go()})}
/* Sesión + punto de venta del usuario */
let initP=null;
function init(){return initP||(initP=_init().finally(()=>{initP=null}))}
async function _init(){
 const{data}=await sb.auth.getSession();logged=!!data.session;admin=false;esAdmin=false;idx=true;sub=null;p=0;punto="";refs=[];photos=[];
 if(!logged){render();return}
 const pf=await sb.from("perfiles").select("punto,rol").maybeSingle();
 esAdmin=!!(pf.data&&pf.data.rol==="admin");admin=esAdmin;punto=(pf.data&&pf.data.punto)||"";
 if(!punto){render();return}
 await load()}
sb.auth.onAuthStateChange((_e,s)=>{if(!!s!==logged)setTimeout(init,0)});
init();
</script>
</body>
</html>
